backend: vllm
model_id: meta-llama/Llama-3.3-70B-Instruct
device: cuda
alias: Llama-3.3-70B-Instruct
load_chat_tokenizer: true
tensor_parallel_size: 4
dtype: bfloat16
gpu_memory_utilization: 0.9
max_model_len: 32768
enforce_eager: true
vllm_kwargs:
  disable_custom_all_reduce: true
  max_num_batched_tokens: 8192
  max_num_seqs: 2
generate:
  max_tokens: 2048
  temperature: 0.0
  stop:
  - '[END_JSON]'
  - <|eot_id|>
  - <|end_of_text|>
sampling:
  seed: 42
  top_p: 1.0
  top_k: -1
  repetition_penalty: 1.0
